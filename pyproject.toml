[project]
name = "docflow"
version = "0.1.0"
description = "Bulgarian Cyrillic OCR / data extraction system for invoices and protocols"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.9",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "azure-ai-documentintelligence>=1.0",
    "streamlit>=1.50",
]

[project.scripts]
docflow = "docflow.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docflow*"]
